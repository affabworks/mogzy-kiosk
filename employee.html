<title>Mogzy · الموظف</title>
<style>
:root{--bg:#F7F4EF;--surface:#fff;--ink:#1F1B17;--mute:#7B7167;--line:#ECE6DD;--gold:#C7A97F;--goldtxt:#8A6A45;--soft:#F2ECE3;--btn:#E0D8CD;--green:#3F7A55;--red:#B5473C;--warn:#F5ECDD;--shadow:0 1px 2px rgba(60,40,20,.04),0 10px 30px rgba(60,40,20,.05)}

.g2k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet .g2k input{padding:0 8px;font-size:16px}@media(max-width:640px){.at th,.at td,.cal th,.cal td{display:table-cell!important}.at td{padding:10px 4px}}
.btns{display:flex;gap:10px;margin:0 0 12px}.sheet .btns{margin:22px 0 0}.clk{cursor:pointer}.clk:active{background:var(--soft)}
.ov{position:fixed;inset:0;background:rgba(31,27,23,.55);display:grid;place-items:center;z-index:90;padding:16px}.sheet{background:var(--surface);border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.ps .nt{font-size:13px;color:var(--mute);line-height:1.9;margin:10px 0}.strip{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #cfc7ba;border-radius:12px;overflow:hidden;margin:10px 0 14px}.strip>div{padding:8px 4px;text-align:center;border-left:1px solid #cfc7ba}.strip>div:last-child{border-left:0}.strip span{display:block;font-size:12px;color:var(--mute)}.strip b{font-size:15px}.strip .r b{color:var(--red)}.strip .net{background:var(--ink)}.strip .net span,.strip .net b{color:#fff}
.ps table.cal{width:100%;border-collapse:collapse;font-size:13px}.ps table.cal th{background:var(--ink);color:#fff;font-weight:600;font-size:12.5px;padding:7px 4px;border:1px solid var(--ink)}.ps table.cal td{border:1px solid #d9d2c7;padding:6px 4px;text-align:center}.ps table.cal td.dy,.ps table.cal td.nt2{text-align:right}.ps table.cal td.dy{white-space:nowrap;font-weight:500}.ps table.cal td.nt2{min-width:96px;font-size:12px}.ps table.cal td{padding:6px 3px}.ps table.cal tr.mu td{color:#a39a8d;background:#f6f3ee}.ps table.cal tr.bad td{background:#fdf1ef}.ps table.cal tr.bad td:nth-child(5){color:var(--red);font-weight:700}.ps table.cal tr.good td:nth-child(6){color:#2f7d4f;font-weight:700}.ps table.cal tr.tt td{font-weight:700;background:#efeae1}
@media print{#pa .strip{border-color:#888}#pa .strip>div{border-color:#888}#pa .strip .net{background:#222;-webkit-print-color-adjust:exact;print-color-adjust:exact}#pa table.cal th{background:#222!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-color:#222}#pa table.cal td{padding:2px 4px;font-size:11px;border:1px solid #999;text-align:center}#pa table.cal td.dy,#pa table.cal td.nt2{text-align:right}#pa table.cal tr.mu td{background:#f1f1f1!important}#pa .nt{font-size:11px}}
.ps tr.dt td{font-size:13px;color:var(--mute);padding:3px 14px 3px 0;border-bottom:0}.ps tr.dt td.n{padding-right:0}.ps h2{margin:0}.ps h3{margin:14px 0 8px;font-size:17px}.ps table{width:100%}.ps td{padding:6px 0;border-bottom:1px solid var(--line)}.ps tr.d td:first-child{color:var(--red)}.ps tr.tot td{font-weight:700;border-bottom:0;font-size:18px}.sig{margin-top:28px;color:var(--mute);font-size:14px}
#pa{display:none}
@media print{body.printing>*:not(#pa){display:none!important}body.printing #pa{display:block;padding:16px;color:#000;background:#fff}#pa table{width:100%;border-collapse:collapse}#pa th,#pa td{border:1px solid #bbb;padding:6px 8px;text-align:right}#pa td.n{text-align:left}#pa td.sg{width:90px}#pa .ps td{border:0;border-bottom:1px solid #ddd}}
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line)}
.row:last-child{border:none}.row .grow{flex:1;min-width:0}
.row b{font-weight:600}.row small{color:var(--mute);font-size:14px;display:block;line-height:1.6}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap}
.c-green{background:#E6F1EA;color:#2F6B47}.c-amber{background:#F6EAD0;color:#7A5714}.c-gray{background:#F0EBE3;color:var(--mute)}.c-red{background:#F6E1DD;color:#8E3A31}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:14px;border:1px solid var(--btn);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sm{height:38px;padding:0 16px;font-size:14px;border-radius:12px}.btn.full{width:100%}
.btn[disabled]{opacity:.5}
label.f{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--mute);font-weight:500;margin:12px 0}
input,select{height:50px;border-radius:13px;border:1px solid var(--btn);background:var(--surface);color:var(--ink);font-size:17px;font-weight:500;padding:0 14px;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);padding:0;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}.stat span{color:var(--mute);font-size:13px}.stat div{font-size:28px;font-weight:600;margin-top:2px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(calc(100% - 24px),520px);display:flex;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px;z-index:5;box-shadow:0 12px 32px rgba(60,40,20,.12)}
.tabs button{flex:1;border:none;background:none;height:54px;border-radius:18px;font-size:12px;font-weight:500;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
.tabs button.on{color:var(--ink);font-weight:600;background:var(--soft)}
.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.err{color:var(--red);font-size:14px;min-height:22px;margin:6px 0}
.ok{color:var(--green)}
.note{background:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7;color:#4A3E30}
.net{background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 24px}.net small{color:var(--gold)}.net div{font-size:clamp(38px,9vw,48px);font-weight:600;direction:ltr;text-align:right}
.code{font-size:28px;font-weight:600;letter-spacing:2px;direction:ltr;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 6px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mute);font-weight:500}td.n{direction:ltr;text-align:left}
.center{display:flex;flex-direction:column;justify-content:center;min-height:82vh;min-height:82dvh;max-width:420px;margin:0 auto}
.link{color:var(--goldtxt);font-weight:600;cursor:pointer;background:none;border:none;font:inherit;padding:0;text-decoration:none}
.hide{display:none!important}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}.pnav b{flex:1;text-align:center;font-size:16px}.pnav .btn{width:44px;padding:0;font-size:22px;line-height:1}
table.pt{table-layout:fixed;width:100%}table.pt th,table.pt td{text-align:center;padding:12px 3px;font-size:13.5px}table.pt th:first-child,table.pt td:first-child{text-align:right;width:26%;padding-right:4px;overflow:hidden;text-overflow:ellipsis}table.pt td.n{direction:ltr;text-align:center;font-variant-numeric:tabular-nums}table.pt th:last-child,table.pt td:last-child{width:19%}
@media(max-width:640px){table.pt th,table.pt td{display:table-cell!important}table.pt th,table.pt td{font-size:12px;padding:10px 1px}}
@media(max-width:640px){.stat div{font-size:24px}.grid2{grid-template-columns:1fr}th:nth-child(n+3):nth-child(-n+5),td:nth-child(n+3):nth-child(-n+5){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>window.MOGZY_START="emp";</script>
<script>
"use strict";
const CFG = window.MOGZY, $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
const hhmm = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 20v-1a4 4 0 0 0-3-3.8M16 4.2a3.5 3.5 0 0 1 0 6.6"/></svg>',
  cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18M16 14.5h2"/></svg>',
  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
const INVITE = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
const LOGO = '<img src="logo.png" alt="Mogzy">';

/* ---------------- REST helpers (the user's own login token; RLS does the protecting) ---------------- */
let S = null;                                   // session {access_token, refresh_token, expires_at, user}
try { S = JSON.parse(localStorage.getItem("mogzy.sess") || "null"); } catch {}
const saveS = (s) => { S = s; try { s ? localStorage.setItem("mogzy.sess", JSON.stringify(s)) : localStorage.removeItem("mogzy.sess"); } catch {} };
async function raw(path, { method = "GET", body, token, prefer } = {}) {
  const r = await fetch(CFG.url + path, { method, headers: { apikey: CFG.key, authorization: "Bearer " + (token || CFG.key), "content-type": "application/json", ...(prefer ? { prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch { j = t; }
  if (!r.ok) { const e = new Error((j && (j.message || j.msg || j.error_description || j.hint)) || "خطأ " + r.status); e.status = r.status; throw e; }
  return j;
}
function setSession(a) { saveS({ access_token: a.access_token, refresh_token: a.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (a.expires_in || 3600) - 60, user: a.user }); }
async function tok() {
  if (!S) throw new Error("no session");
  if (S.expires_at < Date.now() / 1000) { const a = await raw("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: S.refresh_token } }); setSession(a); }
  return S.access_token;
}
const db = async (path, o = {}) => raw("/rest/v1/" + path, { ...o, token: await tok() });
const rpc = async (fn, args = {}) => raw("/rest/v1/rpc/" + fn, { method: "POST", body: args, token: await tok() });
const arabicErr = (e) => {
  const m = e.message || "";
  if (/Invalid login/i.test(m)) return "البريد أو كلمة السر غير صحيحة";
  if (/already registered/i.test(m)) return "هذا البريد مسجّل من قبل، سجّل دخولك";
  if (/no match/i.test(m)) return "الكود أو رقم الموبايل غير مطابق، أو الشركة لم تفعّل دخول الموظفين";
  if (/already belongs/i.test(m)) return "هذا الحساب مرتبط بشركة بالفعل";
  if (/not allowed/i.test(m)) return "غير مسموح من إعدادات الشركة";
  if (/invalid creation code/i.test(m)) return "كود الإنشاء غير صحيح أو ملغي";
  if (/creation code already used/i.test(m)) return "كود الإنشاء استُخدم من قبل";
  if (/Password should/i.test(m)) return "كلمة السر قصيرة: 6 حروف على الأقل";
  if (/confirm/i.test(m)) return "أكّد بريدك من الرسالة التي وصلتك ثم سجّل دخولك";
  return m;
};

/* ---------------- state ---------------- */
const st = { me: null, co: null, set: null, emps: [], sessions: [], adv: [], lv: [], links: [], pay: [], tab: "today", month: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10), mine: null, status: null };
const view = (html) => { $("app").innerHTML = html; };
const val = (id) => ($(id) ? $(id).value.trim() : "");
const setErr = (m, ok) => { const e = $("err"); if (e) { e.textContent = m || ""; e.className = "err" + (ok ? " ok" : ""); } };

/* ---------------- auth screens ---------------- */
/* One front door for everyone: log in, or start as a new company, or as an employee. */
function authScreen(mode) {
  mode = mode || window.MOGZY_START || (INVITE ? "company" : "login");
  if (mode === "login") {
    view(`<div class="wrap"><div class="center">
      <div style="margin-bottom:18px">${LOGO}</div><h1>أهلاً بك</h1>
      <div class="sub">سجّل دخولك بحسابك.</div>
      <label class="f">البريد<input id="em" type="email" dir="ltr" autocomplete="email"></label>
      <label class="f">كلمة السر<input id="pw" type="password" dir="ltr" autocomplete="current-password"></label>
      <div id="err" class="err"></div>
      <button class="btn p full" id="go">دخول</button>
      <div class="sub" style="text-align:center;margin:26px 0 10px">ليس لديك حساب؟</div>
      <div class="grid2"><button class="btn full" id="to-co">شركة جديدة</button><button class="btn full" id="to-emp">أنا موظف</button></div>
    </div></div>`);
    $("to-co").onclick = () => authScreen("company"); $("to-emp").onclick = () => authScreen("emp");
    $("go").onclick = async () => {
      setErr(""); const b = $("go"); b.disabled = true;
      try { setSession(await raw("/auth/v1/token?grant_type=password", { method: "POST", body: { email: val("em"), password: $("pw").value } })); boot(); }
      catch (e) { setErr(arabicErr(e)); b.disabled = false; }
    };
    return;
  }
  pathForm(mode, false);
}

/* kind: "company" | "emp"; loggedIn: the account already exists (no email/password fields) */
function pathForm(kind, loggedIn) {
  const co = kind === "company";
  const acct = loggedIn ? "" : `<label class="f">البريد<input id="em" type="email" dir="ltr" autocomplete="email"></label>
      <label class="f">كلمة السر (6 حروف على الأقل)<input id="pw" type="password" dir="ltr" autocomplete="new-password"></label>`;
  const body = co ? `<label class="f">كود إنشاء الشركة<input id="iv" dir="ltr" placeholder="MGZ-XXXX-XXXX" value="${esc(INVITE)}"></label>
      <div class="sub" style="margin:-4px 0 6px">تحصل عليه من Mogzy عند الاشتراك.</div>
      <label class="f">اسم الشركة<input id="cn" placeholder="مثال: كافيه Woods"></label>
      <label class="f">اسمك<input id="fn"></label>${acct}
      <div class="note" style="margin:10px 0">أتعهد بأخذ موافقة مكتوبة من كل موظف قبل تسجيل وجهه.</div>
      <label style="display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" id="ag"><span>أوافق</span></label>`
    : `<div class="sub">اطلب كود الشركة من الإدارة.</div>
      <label class="f">كود الشركة<input id="cc" dir="ltr" placeholder="XXXX-XXXX"></label>
      <label class="f">رقم موبايلك المسجل عند الشركة<input id="ph" type="tel" dir="ltr"></label>${acct}`;
  view(`<div class="wrap"><div class="top">${LOGO}${loggedIn ? '<button class="btn sm" id="out">خروج</button>' : ""}</div>
    <h1>${co ? "شركة جديدة" : "أنا موظف"}</h1>
    <div class="card">${body}<div id="err" class="err"></div><button class="btn p full" id="mk">${co ? "إنشاء الشركة" : "ربط حسابي"}</button></div>

      <label class="f">اسم العميل (لك أنت فقط)<input id="lb" placeholder="مثال: صيدلية النور"></label>
      <button class="btn p full" id="mk">إنشاء كود</button>
      ${fresh ? `<div class="note" style="margin-top:12px"><div class="code" style="font-size:28px">${esc(fresh)}</div><div style="margin-top:8px"><button class="btn p sm" data-cp="${esc(fresh)}">نسخ الرابط</button></div></div>` : ""}
      <div id="err" class="err"></div></div>
    <div class="card"><h2>الأكواد</h2>${o.invites.map(inv).join("") || '<div class="sub">لا توجد أكواد بعد.</div>'}</div>
    <div class="card"><h2>الشركات</h2>${o.companies.map((c) => `<div class="row"><div class="grow"><b>${esc(c.name)}</b><small>المالك: ${esc(c.owner || "-")} · كود الموظفين ${esc(c.code)}</small><small>${c.employees} موظف · ${c.with_face} بوجه مسجّل · ${c.last_punch ? "آخر بصمة " + new Date(c.last_punch).toLocaleDateString("ar-EG", { day: "numeric", month: "short" }) : "لا بصمات بعد"}</small><small>${subText(c)}</small></div>${subChip(c)}<button class="btn sm" data-sub="${c.id}">الاشتراك</button></div>`).join("") || '<div class="sub">لا توجد شركات.</div>'}</div></div>`);
  $("out").onclick = logout;
  document.querySelectorAll("[data-sub]").forEach((b) => (b.onclick = () => subSheet(o.companies.find((c) => c.id === b.dataset.sub))));
  $("mk").onclick = async () => { setErr(""); try { const c = await rpc("platform_create_invite", { p_label: val("lb") }); loadPlatform(c); } catch (e) { setErr(arabicErr(e)); } };
  document.querySelectorAll("[data-cp]").forEach((b) => (b.onclick = async () => { const ok = await copyText(inviteLink(b.dataset.cp)); if (ok) { b.textContent = "تم النسخ ✓"; } }));
  document.querySelectorAll("[data-rv]").forEach((b) => (b.onclick = async () => { if (!confirm("إلغاء هذا الكود؟")) return; try { await rpc("platform_revoke_invite", { p_code: b.dataset.rv }); loadPlatform(); } catch (e) { alert(arabicErr(e)); } }));
}

boot();
</script>
</body>
</html>
